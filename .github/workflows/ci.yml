name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Bundle
        run: npm run build

      - name: Verify skills/agent-friendly/dist/ is in sync with src/
        run: |
          if [ -n "$(git status --porcelain skills/agent-friendly/dist/)" ]; then
            echo "::error::skills/agent-friendly/dist/ is out of sync with src/. Run 'npm run build' locally and commit the result."
            git status --porcelain skills/agent-friendly/dist/
            git --no-pager diff --stat skills/agent-friendly/dist/
            exit 1
          fi
