name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Explicit bash adds pipefail, so the piped steps fail when their first command does.
defaults:
  run:
    shell: bash

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: File length
        run: |
          find src -name '*.ts' -exec wc -l {} + |
            awk '$2 != "total" && $1 > 300 { printf "::error file=%s::%d lines (cap: 300)\n", $2, $1; bad=1 } END { exit bad+0 }'

      - name: Bundle
        run: npm run build

      - name: Verify skills/agent-friendly/dist/ is in sync with src/
        run: |
          if [ -n "$(git status --porcelain skills/agent-friendly/dist/)" ]; then
            echo "::error::skills/agent-friendly/dist/ is out of sync with src/. Run 'npm run build' locally and commit the result."
            git status --porcelain skills/agent-friendly/dist/
            git --no-pager diff --stat skills/agent-friendly/dist/
            exit 1
          fi

      - name: Run bundled skill against this repo
        run: |
          node skills/agent-friendly/dist/index.js . | node -e 'process.exit(typeof JSON.parse(require("fs").readFileSync(0, "utf8")).overall === "number" ? 0 : 1)'
          node skills/agent-friendly/dist/index.js . --summary | grep -E '^agent-friendly: [0-9.]+ \((high|mid|low)\) · best: '

  # `engines.node` promises this floor; nothing else runs on it.
  node-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.9.0
          cache: npm

      - name: Install
        run: npm ci

      - name: Tests
        run: npm test

      - name: Run bundled skill
        run: node skills/agent-friendly/dist/index.js . --summary
