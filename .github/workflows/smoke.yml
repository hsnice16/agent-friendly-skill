name: Smoke

on:
  pull_request:

jobs:
  self-score:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Bundle
        run: npm run build

      - name: Run bundled skill against this repo
        run: |
          node skills/agent-friendly/dist/index.js .
          echo "---"
          node skills/agent-friendly/dist/index.js . --summary
